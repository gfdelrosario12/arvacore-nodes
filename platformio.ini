[platformio]
default_envs = node_production

[env]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; --- Default: Production ArvaNode Firmware ---
[env:node_production]
src_dir = sketch_oct11a

; --- Modular Hardware Diagnostics & Tests ---
[env:test_01_board_audit]
src_dir = tests/01_esp32_board_audit

[env:test_02_ultrasonic]
src_dir = tests/02_ultrasonic_test

[env:test_03_soil_moisture]
src_dir = tests/03_soil_moisture_test

[env:test_04_activation_button]
src_dir = tests/04_activation_button_test

[env:test_05_pairing_button]
src_dir = tests/05_pairing_button_test

[env:test_06_green_led]
src_dir = tests/06_green_led_test

[env:test_07_blue_led]
src_dir = tests/07_blue_led_test

[env:test_08_adc_stability]
src_dir = tests/08_adc_stability_test

[env:test_10_wifi]
src_dir = tests/10_wifi_test

[env:test_11_backend]
src_dir = tests/11_backend_connectivity_test

[env:test_13_integrated_sensors]
src_dir = tests/13_integrated_sensor_test
